services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: linkly
      POSTGRES_USER: linkly
      POSTGRES_PASSWORD: linkly
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkly"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
